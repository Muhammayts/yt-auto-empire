name: Manual — Render & Upload (custom job)

on:
  push:
    paths:
      - 'jobs/current_job.json'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Write Google credentials
        run: |
          echo '${{ secrets.YT_CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.YT_TOKEN_JSON }}' > yt_token.json

      - name: Run pipeline
        run: python src/pipeline.py
        env:
          JOB_FILE: jobs/current_job.json
          PYTHONPATH: ${{ github.workspace }}/src
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_BACKEND: ${{ secrets.TTS_BACKEND }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload video artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 3
