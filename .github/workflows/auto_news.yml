name: Auto — Fetch SugoidesJapan Content & Upload (scheduled)

# Runs 3× daily: 00:00, 08:00, 16:00 UTC
# = 09:00, 17:00, 01:00 Japan Standard Time (JST = UTC+9)
# Peak Japanese internet activity: morning commute + evening wind-down
# Also triggerable manually from GitHub Actions tab

on:
  schedule:
    - cron: '0 0 * * *'    # 00:00 UTC (09:00 JST)
    - cron: '0 8 * * *'    # 08:00 UTC (17:00 JST)
    - cron: '0 16 * * *'   # 16:00 UTC (01:00 JST next day)
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language: ja or en'
        required: false
        default: 'ja'

jobs:
  auto-news:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu-extra \
            fonts-noto-cjk fonts-noto-cjk-extra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Write Google credentials
        run: |
          echo '${{ secrets.YT_CLIENT_SECRETS_JSON }}' > client_secrets.json
          echo '${{ secrets.YT_TOKEN_JSON }}' > yt_token.json

      - name: Fetch Japan trending content + render + upload
        run: python src/pipeline.py
        env:
          JOB_FILE: jobs/current_job.json
          PYTHONPATH: ${{ github.workspace }}/src
          AUTO_NEWS: "true"
          NEWS_LANG: ${{ github.event.inputs.lang || 'ja' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_BACKEND: ${{ secrets.TTS_BACKEND }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit story history (prevents repeats on next run)
        if: success()
        run: |
          git config user.name  "SugoidesJapan Bot"
          git config user.email "bot@sugoidеsjapan.auto"
          git add jobs/seen_stories.json jobs/current_job.json || true
          git diff --cached --quiet || git commit -m "chore: update story history + job [skip ci]"
          git push || true

      - name: Upload video artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-japan-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 3
